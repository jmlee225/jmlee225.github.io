<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop Engineering</title>
  <meta name="description" content="반응형 개인 프로페셔널 웹사이트">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top">Loop Engineering</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">메뉴</button>
    <nav id="primary-nav" class="site-nav" aria-label="주요 메뉴">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#games">Games</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow">프로필 자료 없음</p>
      <h1>반응형 개인 웹사이트의 첫 뼈대</h1>
      <p class="lead">기존 콘텐츠는 보존하고, 정적 HTML/CSS/JavaScript만으로 시작합니다.</p>
    </section>

    <section id="about" class="panel">
      <h2>About</h2>
      <p>소개 문구는 추후 입력합니다.</p>
    </section>

    <section id="projects" class="panel">
      <h2>Projects</h2>
      <p>프로젝트 목록은 추후 채웁니다.</p>
    </section>

    <section id="games" class="panel games-panel">
      <div class="section-head">
        <h2>Games</h2>
        <p>지렁이 게임은 다음 루프에서 붙입니다.</p>
      </div>
      <div class="game-placeholder" role="status" aria-live="polite">
        게임 영역 준비 완료
      </div>
    </section>

    <section id="contact" class="panel">
      <h2>Contact</h2>
      <p>연락처는 추후 입력합니다.</p>
    </section>
  </main>

  <footer class="site-footer">
    <small>정적 HTML/CSS/JavaScript 기반</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
